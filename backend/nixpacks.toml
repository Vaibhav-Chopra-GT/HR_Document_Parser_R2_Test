# Force nix provider, skip mise entirely
providers = []

[phases.setup]
nixPkgs = ["python312", "python312Packages.pip", "gcc"]

[phases.install]
dependsOn = ["setup"]
cmds = ["python -m venv /app/.venv", "/app/.venv/bin/pip install -r requirements.txt"]

[start]
cmd = "/app/.venv/bin/gunicorn run:app --bind 0.0.0.0:$PORT"
